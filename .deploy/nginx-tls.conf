# trial-booking: nginx vhost, HTTPS (port 443) with a port 80 redirect.
#
# vps-setup.sh installs this to /etc/nginx/sites-available/trial-booking once
# /etc/letsencrypt/live/example.com/ exists. The certificate comes from
# `certbot certonly --webroot`, never from `certbot --nginx`: the nginx plugin
# rewrites the vhost and would drop the header includes. This file stays the
# only source of truth, and renewals only reload nginx.
#
# PLACEHOLDERS (vps-setup.sh replaces them, or edit by hand):
#   example.com                  your domain, also the certbot lineage name
#   /home/deploy/trial-booking   the deploy root, in snippets/trial-booking-app.conf

upstream trial_booking_api {
	server 127.0.0.1:4001;
	keepalive 16;
}

# Port 80: ACME renewals and a redirect, nothing else.
server {
	listen 80;
	listen [::]:80;
	server_name example.com;
	server_tokens off;

	location ^~ /.well-known/acme-challenge/ {
		include /etc/nginx/snippets/trial-booking-security-headers.conf;
		root /var/www/certbot;
		default_type text/plain;
	}

	# $server_name rather than $host, so a forged Host header cannot choose the
	# redirect target.
	location / {
		include /etc/nginx/snippets/trial-booking-security-headers.conf;
		return 301 https://$server_name$request_uri;
	}
}

server {
	# `listen ... http2` instead of `http2 on;`: the latter needs nginx 1.25.1+,
	# and Ubuntu 22.04/24.04 ship 1.18/1.24. Newer nginx only logs a deprecation.
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name example.com;

	ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

	# Mozilla "intermediate": TLS 1.2 and 1.3. Self-contained on purpose:
	# certbot's options-ssl-nginx.conf only exists when its nginx installer ran,
	# and it never does here.
	ssl_protocols             TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
	ssl_session_timeout       1d;
	ssl_session_cache         shared:TrialBookingTLS:10m;
	ssl_session_tickets       off;

	include /etc/nginx/snippets/trial-booking-app.conf;
}

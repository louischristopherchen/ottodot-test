# trial-booking: reverse proxy settings for the API (PM2: trial-booking-api).
# Installed to /etc/nginx/snippets/trial-booking-proxy.conf
#
# Included by every location that forwards to the API (/api/, /health,
# /health/ready). `proxy_set_header` has the same inheritance rule as
# `add_header`, so keeping the whole set in one file avoids a location that
# forwards without the X-Forwarded-* headers.

# `trial_booking_api` is the upstream defined in the vhost (127.0.0.1:4001).
# No URI after the upstream name, so /api/... reaches Express unchanged.
proxy_pass http://trial_booking_api;

# HTTP/1.1 with an empty Connection header enables upstream keepalive.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# nginx is the edge, so it overwrites X-Forwarded-For instead of appending to
# whatever the client sent. With TRUST_PROXY=1 Express then sees the real client
# address, and a forged header cannot dodge the per-IP rate limits.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# nginx sets these for every response (trial-booking-security-headers.conf);
# drop helmet's copies so the browser never sees two different values.
proxy_hide_header Content-Security-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header X-Powered-By;

# API responses carry personal data (rosters list parent emails), so no browser
# or intermediate cache may store them. Set here, next to proxy_pass, so every
# location that forwards to the API gets it. This `add_header` sits in the same
# location block as the security-headers include (both are included there), so
# it adds to those headers instead of replacing them. The API's own
# Cache-Control, if any, is hidden so exactly one value reaches the client.
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;

proxy_connect_timeout 5s;
# The payment call waits on the provider (up to PAYMENT_PROVIDER_TIMEOUT_MS).
# 60s stays well above that so nginx never cuts a payment response short.
proxy_read_timeout 60s;
proxy_send_timeout 60s;

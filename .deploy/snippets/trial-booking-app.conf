# trial-booking: shared server body (static SPA + API proxy).
# Installed to /etc/nginx/snippets/trial-booking-app.conf
#
# Included from server{} by both vhosts (.deploy/nginx.conf for plain HTTP,
# .deploy/nginx-tls.conf for HTTPS) so routing and headers cannot drift.
#
# PLACEHOLDER (vps-setup.sh replaces it, or edit by hand):
#   /home/deploy/trial-booking   the deploy root, same value as the
#                                DEPLOY_PATH repository variable
#
# INVARIANT: every location includes trial-booking-security-headers.conf.
# Read the top of that file before adding a location.
#
# The payments sandbox (127.0.0.1:4002) is deliberately not proxied. Only the
# API talks to it, over loopback.

root  /home/deploy/trial-booking/apps/web/dist;
index index.html;

server_tokens off;

# The API rejects JSON bodies over 16kb with its own error envelope. A higher
# limit here lets that JSON 413 reach the SPA instead of nginx's HTML page,
# while still refusing anything large before it reaches Node.
client_max_body_size 64k;

gzip            on;
gzip_vary       on;
gzip_proxied    any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
	text/plain
	text/css
	text/javascript
	application/javascript
	application/json
	application/manifest+json
	image/svg+xml;

# -----------------------------------------------------------------------------
# API. `^~` stops the regex locations below from ever matching an /api/ path.
# -----------------------------------------------------------------------------
location ^~ /api/ {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	include /etc/nginx/snippets/trial-booking-proxy.conf;
}

# Health probes (deploy check, uptime monitors). Exact matches, no logging.
location = /health {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	include /etc/nginx/snippets/trial-booking-proxy.conf;
	access_log off;
}

location = /health/ready {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	include /etc/nginx/snippets/trial-booking-proxy.conf;
	access_log off;
}

# -----------------------------------------------------------------------------
# Regex locations are checked in file order and the first match wins, so the
# deny rules come before the cache rule.
# -----------------------------------------------------------------------------

# Never serve dotfiles (.env, .git, ...). ACME challenges live under
# /.well-known/ and are matched earlier by a `^~` prefix in the vhost.
location ~ /\. {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	deny all;
	access_log off;
	log_not_found off;
}

# Source maps expose the original source; never serve them.
location ~* \.map$ {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	deny all;
	access_log off;
}

# Content-hashed build output (main.3f9a1c2b.js). The name changes whenever the
# content does, so a year plus `immutable` is safe. Files without a hash fall
# through to `location /` and are revalidated. The regex is quoted because a
# bare {8,} is read as a block delimiter.
location ~* "\.[0-9a-f]{8,}\.(?:js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?)$" {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	add_header Cache-Control "public, max-age=31536000, immutable" always;
	access_log off;
}

# -----------------------------------------------------------------------------
# SPA shell. index.html names the current hashed bundles, so it is never
# stored: a cached copy would pin a returning visitor to an old release.
# -----------------------------------------------------------------------------
location = /index.html {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	add_header Cache-Control "no-store" always;
}

# Client-side routes (/bookings/123) have no file on disk and fall back to
# index.html, which the exact match above then serves with no-store.
location / {
	include /etc/nginx/snippets/trial-booking-security-headers.conf;
	add_header Cache-Control "no-cache" always;
	try_files $uri /index.html;
}

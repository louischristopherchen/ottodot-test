# trial-booking: security response headers.
# Installed to /etc/nginx/snippets/trial-booking-security-headers.conf
#
# INCLUDE THIS FILE IN EVERY `location` BLOCK.
#
# nginx inherits `add_header` from the enclosing level only when the current
# level defines no `add_header` of its own. A location that sets even one header
# (Cache-Control on hashed assets, for example) silently drops every header set
# at server level. Including this file per location is the only layout that
# cannot lose them after an edit.
#
# `always` keeps the headers on 4xx and 5xx responses too.
#
# The API sets its own copies through helmet. snippets/trial-booking-proxy.conf
# hides those so the browser gets exactly one of each, and nginx is the single
# source for what is below.

# CSP for a React SPA that only talks to its own origin (/api):
#   script-src 'self'         no inline scripts, no eval
#   script-src-attr 'none'    no inline event handlers (onclick=...)
#   style-src 'unsafe-inline' allowed for styles only: component libraries
#                             (Radix) and some bundler setups inject <style>
#                             tags at runtime. Drop it if the built index.html
#                             and the UI work without it.
#   connect-src 'self'        fetch/XHR to same-origin /api only
#   frame-ancestors 'none'    no framing (clickjacking)
# `upgrade-insecure-requests` is left out: before a certificate exists the site
# runs on plain HTTP and it would break every asset. HSTS covers HTTPS instead.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Browsers ignore HSTS on plain HTTP, so sending it before TLS is harmless.
# includeSubDomains covers subdomains of the server_name, not its parent.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options       "nosniff"                                always;
add_header X-Frame-Options              "DENY"                                   always;
add_header Referrer-Policy              "strict-origin-when-cross-origin"        always;
add_header Permissions-Policy           "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy   "same-origin"                            always;
add_header Cross-Origin-Resource-Policy "same-origin"                            always;

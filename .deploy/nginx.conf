# trial-booking: nginx vhost, plain HTTP (port 80).
#
# vps-setup.sh installs this to /etc/nginx/sites-available/trial-booking while
# no certificate exists, and switches to .deploy/nginx-tls.conf once
# `certbot certonly` has obtained one. It also works on its own for a demo that
# is reached by IP address.
#
# PLACEHOLDERS (vps-setup.sh replaces them, or edit by hand):
#   example.com                  your domain
#   /home/deploy/trial-booking   the deploy root, in snippets/trial-booking-app.conf
#
# Files this vhost includes, installed to /etc/nginx/snippets/:
#   trial-booking-app.conf               static root, gzip, every location
#   trial-booking-proxy.conf             proxy settings for the API
#   trial-booking-security-headers.conf  CSP, HSTS and friends

# The API under PM2 (trial-booking-api). Loopback only; UFW never opens 4001.
upstream trial_booking_api {
	server 127.0.0.1:4001;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name example.com;

	# HTTP-01 challenges for `certbot certonly --webroot -w /var/www/certbot`.
	# `^~` beats the dotfile deny rule in trial-booking-app.conf.
	location ^~ /.well-known/acme-challenge/ {
		include /etc/nginx/snippets/trial-booking-security-headers.conf;
		root /var/www/certbot;
		default_type text/plain;
	}

	include /etc/nginx/snippets/trial-booking-app.conf;
}

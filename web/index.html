<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ottodot Trial Booking</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Ottodot trial booking <span class="tag">demo</span></div>
      <label class="signin">
        Signed in as
        <select id="user-select" aria-label="Signed in as"></select>
      </label>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer">
      Payments are mocked. To try the last-seat race, open a second window as another parent
      (for example <code>?as=par_chloe</code>) and pay for the same last seat.
    </footer>
  </body>
</html>
